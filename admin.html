<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল | পল্লী চিকিৎসা একাডেমি</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Hind Siliguri',sans-serif;background:#f1f5f9;color:#1e293b;padding:20px;}
        .admin-container{max-width:1400px;margin:0 auto;}
        .admin-header{background:linear-gradient(135deg,#064e3b,#047857);color:white;padding:24px;border-radius:24px;margin-bottom:30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
        .admin-header h1{font-size:24px;display:flex;align-items:center;gap:10px;}
        .view-site-btn{background:rgba(255,255,255,0.2);color:white;padding:10px 20px;border-radius:50px;text-decoration:none;font-weight:600;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:30px;}
        .stat-card{background:white;padding:20px;border-radius:20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
        .stat-number{font-size:32px;font-weight:700;color:#059669;}
        .add-btn{background:#059669;color:white;border:none;padding:14px 28px;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:24px;display:inline-flex;align-items:center;gap:8px;}
        .tabs{display:flex;gap:12px;margin-bottom:24px;border-bottom:2px solid #e2e8f0;}
        .tab{ padding:12px 24px;cursor:pointer;font-weight:600;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;}
        .tab.active{color:#059669;border-bottom-color:#059669;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .courses-table-wrapper{overflow-x:auto;background:white;border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,0.05);margin-bottom:30px;}
        .courses-table{width:100%;border-collapse:collapse;min-width:800px;}
        .courses-table th,.courses-table td{padding:16px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .courses-table th{background:#f8fafc;font-weight:600;}
        .action-btns{display:flex;gap:8px;}
        .edit-btn,.delete-btn{padding:6px 14px;border-radius:30px;border:none;cursor:pointer;font-size:12px;font-weight:600;}
        .edit-btn{background:#dbeafe;color:#1e40af;}
        .delete-btn{background:#fee2e2;color:#991b1b;}
        .applications-table{width:100%;border-collapse:collapse;background:white;border-radius:24px;overflow:hidden;}
        .applications-table th,.applications-table td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px;}
        .applications-table th{background:#f8fafc;}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:1000;}
        .modal.active{display:flex;}
        .modal-content{background:white;border-radius:28px;max-width:550px;width:90%;max-height:90vh;overflow-y:auto;padding:24px;animation:modalSlide 0.3s;}
        @keyframes modalSlide{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
        .form-group{margin-bottom:16px;}
        .form-group label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:14px;font-family:inherit;}
        .plan-row{display:flex;gap:12px;margin-bottom:12px;align-items:center;}
        .plan-row input{flex:1;}
        .remove-plan{background:#fee2e2;border:none;padding:8px 12px;border-radius:12px;cursor:pointer;}
        .add-plan{background:#f1f5f9;border:1px dashed #cbd5e1;padding:10px;width:100%;border-radius:14px;cursor:pointer;margin-top:8px;}
        .modal-buttons{display:flex;gap:12px;margin-top:24px;}
        .save-btn{background:#059669;color:white;padding:12px;border-radius:50px;flex:1;border:none;font-weight:600;cursor:pointer;}
        .cancel-btn{background:#e2e8f0;padding:12px;border-radius:50px;flex:1;border:none;cursor:pointer;}
        .toast{position:fixed;bottom:30px;right:30px;background:#059669;color:white;padding:12px 24px;border-radius:50px;animation:slideIn 0.3s;z-index:1100;}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        @media (max-width:600px){body{padding:12px;}.stat-number{font-size:24px;}}
    </style>
</head>
<body>
<div class="admin-container">
    <div class="admin-header">
        <h1>🛠️ অ্যাডমিন প্যানেল</h1>
        <a href="index.html" class="view-site-btn" target="_blank">🌐 ওয়েবসাইট দেখুন</a>
    </div>
    <div class="stats-grid">
        <div class="stat-card"><div class="stat-number" id="totalCourses">0</div><div>মোট কোর্স</div></div>
        <div class="stat-card"><div class="stat-number" id="totalApplications">0</div><div>মোট আবেদন</div></div>
    </div>
    <div class="tabs">
        <div class="tab active" data-tab="courses">📚 কোর্স ম্যানেজ</div>
        <div class="tab" data-tab="applications">📋 আবেদনপত্র</div>
    </div>
    <div id="coursesTab" class="tab-content active">
        <button class="add-btn" id="openAddModalBtn">➕ নতুন কোর্স যোগ করুন</button>
        <div class="courses-table-wrapper">
            <table class="courses-table"><thead><tr><th>ক্রম</th><th>কোর্সের নাম</th><th>মূল্য</th><th>লেভেল</th><th>আসন</th><th>অ্যাকশন</th></tr></thead><tbody id="coursesTableBody"></tbody></table>
        </div>
    </div>
    <div id="applicationsTab" class="tab-content">
        <div class="courses-table-wrapper">
            <table class="applications-table"><thead><tr><th>তারিখ</th><th>নাম</th><th>ফোন</th><th>ঠিকানা</th><th>কোর্স</th><th>মেয়াদ</th><th>প্রশ্ন</th></tr></thead><tbody id="applicationsTableBody"></tbody></table>
        </div>
        <button id="clearAppsBtn" style="margin-top:16px;background:#ef4444;color:white;border:none;padding:10px 20px;border-radius:50px;">🗑️ সব আবেদন মুছুন</button>
    </div>
</div>

<!-- কোর্স মডাল -->
<div class="modal" id="courseModal"><div class="modal-content"><h2 id="modalTitle">➕ নতুন কোর্স</h2><form id="courseForm"><div class="form-group"><label>কোর্সের নাম *</label><input type="text" id="courseName" required></div><div class="form-group"><label>ইমোজি</label><input type="text" id="courseEmoji" value="🏥"></div><div class="form-group"><label>আইকন রং</label><input type="text" id="iconBg" value="#dcfce7"></div><div class="form-group"><label>মূল্য পরিসর *</label><input type="text" id="priceRange" required></div><div class="form-group"><label>লেভেল</label><input type="text" id="level" value="সবার জন্য"></div><div class="form-group"><label>আসন সংখ্যা</label><input type="text" id="seats" value="৪০ আসন"></div><div class="form-group"><label>বিবরণ</label><textarea id="desc" rows="3"></textarea></div><div class="form-group"><label>টপিক্স (কমা দিয়ে)</label><input type="text" id="topics"></div><div class="form-group"><label>ট্যাগ রং</label><input type="text" id="tagColor" value="#166534"></div><div class="form-group"><label>ট্যাগ ব্যাকগ্রাউন্ড</label><input type="text" id="tagBg" value="#dcfce7"></div><label>মেয়াদ ও মূল্য:</label><div id="plansContainer"></div><button type="button" class="add-plan" id="addPlanBtn">+ আরও যোগ করুন</button><div class="modal-buttons"><button type="submit" class="save-btn">সংরক্ষণ</button><button type="button" class="cancel-btn" id="closeModalBtn">বাতিল</button></div></form></div></div>

<script>
let courses = [];
let editingIndex = null;

function loadData(){
    const stored = localStorage.getItem('palli_courses_live');
    if(stored && stored !== "undefined"){
        try{ courses = JSON.parse(stored); if(!Array.isArray(courses)) courses = []; }catch(e){ courses = []; }
    }
    if(!courses.length){
        courses = [
            {name:"পল্লী চিকিৎসা কোর্স", emoji:"🏥", iconBg:"#dcfce7", priceRange:"৳২,৫০০ - ৳১২,০০০", plans:[{duration:"৩ মাস",price:"৳২,৫০০"},{duration:"৬ মাস",price:"৳৫,৫০০"},{duration:"১ বছর",price:"৳১২,০০০"}], level:"সবার জন্য", seats:"৪০ আসন", desc:"গ্রামীণ স্বাস্থ্যসেবা কোর্স", topics:"প্রাথমিক চিকিৎসা,জ্বর", tagColor:"#166534", tagBg:"#dcfce7"},
            {name:"মানব চিকিৎসা সহকারী", emoji:"👨‍⚕️", iconBg:"#dbeafe", priceRange:"৳৩,৫০০ - ৳১৫,০০০", plans:[{duration:"৩ মাস",price:"৳৩,৫০๐"},{duration:"৬ মাস",price:"৳৮,০০০"},{duration:"১ বছর",price:"৳১৫,০০০"}], level:"অ্যাডভান্স", seats:"৩০ আসন", desc:"ডাক্তার সহকারী প্রশিক্ষণ", topics:"রোগী ব্যবস্থাপনা,ওষুধ", tagColor:"#1e40af", tagBg:"#dbeafe"}
        ];
        saveCourses();
    }
    renderCourseTable();
    updateStats();
}

function saveCourses(){
    localStorage.setItem('palli_courses_live', JSON.stringify(courses));
    updateStats();
}

function updateStats(){
    document.getElementById('totalCourses').innerText = courses.length;
    let apps = localStorage.getItem('palli_applications');
    apps = apps ? JSON.parse(apps).length : 0;
    document.getElementById('totalApplications').innerText = apps;
    renderApplicationsTable();
}

function renderCourseTable(){
    const tbody = document.getElementById('coursesTableBody');
    tbody.innerHTML = '';
    courses.forEach((c,idx)=>{
        const row = tbody.insertRow();
        row.insertCell(0).innerText = idx+1;
        row.insertCell(1).innerHTML = `${c.emoji} ${c.name}`;
        row.insertCell(2).innerText = c.priceRange;
        row.insertCell(3).innerText = c.level;
        row.insertCell(4).innerText = c.seats;
        row.insertCell(5).innerHTML = `<div class="action-btns"><button class="edit-btn" data-index="${idx}">✏️ এডিট</button><button class="delete-btn" data-index="${idx}">🗑️ ডিলিট</button></div>`;
    });
    document.querySelectorAll('.edit-btn').forEach(btn=>btn.addEventListener('click',(e)=>openEditModal(parseInt(btn.dataset.index))));
    document.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',(e)=>{ if(confirm('ডিলিট?')){ courses.splice(parseInt(btn.dataset.index),1); saveCourses(); renderCourseTable(); showToast('ডিলিট হয়েছে'); } }));
}

function renderApplicationsTable(){
    const tbody = document.getElementById('applicationsTableBody');
    if(!tbody) return;
    let apps = localStorage.getItem('palli_applications');
    apps = apps ? JSON.parse(apps) : [];
    tbody.innerHTML = '';
    apps.reverse().forEach(app=>{
        const row = tbody.insertRow();
        row.insertCell(0).innerText = app.timestamp || new Date().toLocaleString();
        row.insertCell(1).innerText = app.name || '';
        row.insertCell(2).innerText = app.phone || '';
        row.insertCell(3).innerText = app.address || '';
        row.insertCell(4).innerText = app.course || '';
        row.insertCell(5).innerText = app.duration_plan || '';
        row.insertCell(6).innerText = app.message || '';
    });
}

function getPlansFromForm(){
    const durations = document.querySelectorAll('.plan-duration');
    const prices = document.querySelectorAll('.plan-price');
    let plans = [];
    for(let i=0;i<durations.length;i++) plans.push({duration:durations[i].value, price:prices[i].value});
    return plans;
}

function renderPlansForm(plans){
    const container = document.getElementById('plansContainer');
    container.innerHTML = '';
    plans.forEach((plan,idx)=>{
        const div = document.createElement('div'); div.className='plan-row';
        div.innerHTML = `<input type="text" placeholder="মেয়াদ" value="${plan.duration}" class="plan-duration"><input type="text" placeholder="মূল্য" value="${plan.price}" class="plan-price"><button type="button" class="remove-plan" data-idx="${idx}">✖️</button>`;
        container.appendChild(div);
    });
    document.querySelectorAll('.remove-plan').forEach(btn=>btn.addEventListener('click',(e)=>{ let plansArr=getPlansFromForm(); plansArr.splice(parseInt(btn.dataset.idx),1); renderPlansForm(plansArr); }));
}

function openEditModal(idx){
    editingIndex = idx;
    const c = courses[idx];
    document.getElementById('modalTitle').innerText = '✏️ কোর্স এডিট';
    document.getElementById('courseName').value = c.name;
    document.getElementById('courseEmoji').value = c.emoji;
    document.getElementById('iconBg').value = c.iconBg;
    document.getElementById('priceRange').value = c.priceRange;
    document.getElementById('level').value = c.level;
    document.getElementById('seats').value = c.seats;
    document.getElementById('desc').value = c.desc;
    document.getElementById('topics').value = c.topics;
    document.getElementById('tagColor').value = c.tagColor;
    document.getElementById('tagBg').value = c.tagBg;
    renderPlansForm(c.plans);
    document.getElementById('courseModal').classList.add('active');
}

function openAddModal(){
    editingIndex = null;
    document.getElementById('modalTitle').innerText = '➕ নতুন কোর্স';
    document.getElementById('courseName').value = '';
    document.getElementById('courseEmoji').value = '🏥';
    document.getElementById('iconBg').value = '#dcfce7';
    document.getElementById('priceRange').value = '';
    document.getElementById('level').value = 'সবার জন্য';
    document.getElementById('seats').value = '৪০ আসন';
    document.getElementById('desc').value = '';
    document.getElementById('topics').value = '';
    document.getElementById('tagColor').value = '#166534';
    document.getElementById('tagBg').value = '#dcfce7';
    renderPlansForm([{duration:"৩ মাস",price:"৳০"},{duration:"৬ মাস",price:"৳০"}]);
    document.getElementById('courseModal').classList.add('active');
}

document.getElementById('courseForm')?.addEventListener('submit',(e)=>{
    e.preventDefault();
    const plans = getPlansFromForm();
    if(plans.length===0) return alert('অন্তত একটি মেয়াদ দিন');
    const courseData = {
        name: document.getElementById('courseName').value,
        emoji: document.getElementById('courseEmoji').value,
        iconBg: document.getElementById('iconBg').value,
        priceRange: document.getElementById('priceRange').value,
        level: document.getElementById('level').value,
        seats: document.getElementById('seats').value,
        desc: document.getElementById('desc').value,
        topics: document.getElementById('topics').value,
        tagColor: document.getElementById('tagColor').value,
        tagBg: document.getElementById('tagBg').value,
        plans: plans
    };
    if(!courseData.name) return alert('নাম দিন');
    if(!courseData.priceRange) return alert('মূল্য দিন');
    if(editingIndex!==null) courses[editingIndex]=courseData;
    else courses.push(courseData);
    saveCourses();
    renderCourseTable();
    document.getElementById('courseModal').classList.remove('active');
    showToast(editingIndex!==null ? 'আপডেট হয়েছে' : 'যোগ হয়েছে');
});

document.getElementById('addPlanBtn')?.addEventListener('click',()=>{ let p=getPlansFromForm(); p.push({duration:"নতুন মেয়াদ",price:"৳০"}); renderPlansForm(p); });
document.getElementById('openAddModalBtn')?.addEventListener('click',openAddModal);
document.getElementById('closeModalBtn')?.addEventListener('click',()=>document.getElementById('courseModal').classList.remove('active'));
document.getElementById('clearAppsBtn')?.addEventListener('click',()=>{ if(confirm('সব আবেদন মুছে ফেলতে চান?')){ localStorage.removeItem('palli_applications'); updateStats(); showToast('সব আবেদন মুছে ফেলা হয়েছে'); } });

document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab+'Tab').classList.add('active');
        if(tab.dataset.tab === 'applications') renderApplicationsTable();
    });
});

function showToast(msg){ const t=document.createElement('div'); t.className='toast'; t.innerText=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
loadData();
</script>
</body>
</html>
